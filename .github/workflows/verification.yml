name: Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .ai-learning/verification

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .ai-learning/verification/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test
